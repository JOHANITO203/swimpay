bank_profile_id: ozon_bank
display_name: "Ozon Банк"
country: RU
status: review_only
auto_confirm_status: disabled
notes: "Package name is unknown and must be validated on a real Android device before runtime capture is enabled."

trusted_apps:
  - package_name: TO_VERIFY
    cert_sha256: TO_VERIFY
    verification_status: pending_verification
    source: package_unknown_needs_device_validation

supported_locales:
  - ru-RU

field_priority:
  - EXTRA_TITLE
  - EXTRA_TITLE_BIG
  - EXTRA_TEXT
  - EXTRA_BIG_TEXT
  - EXTRA_TEXT_LINES
  - EXTRA_SUB_TEXT
  - EXTRA_SUMMARY_TEXT
  - tickerText
  - channelId
  - groupKey

template_defaults:
  require_amount_for_signal_quality: true
  require_direction_for_signal_quality: true
  require_phone_or_reference_for_auto_confirm: true
  require_no_collision_for_auto_confirm: true
  parse_combined_fields: true
  coalescing_required: true

operational_limits:
  initial_max_auto_confirm_minor:
    RUB: 0
  review_required_above_minor:
    RUB: 0
  disable_auto_confirm_if_drift_status:
    - major_drift
    - critical_drift

privacy:
  upload_raw_text_default: false
  store_redacted_text: true
  store_phone_raw: false
  store_phone_hmac: true
