<title>SwimPay en scénarios</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Archivo:wdth,wght@62..125,500..900&display=swap">
<style>
/* ------------------------------------------------------------------
   L'onboarding SwimPay, grammaire « Photo et verre » (choix de LO sur la
   planche du 28/09/2026), titres Archivo condense.
     - une grande photo dans une carte bord a bord, rayon bas 36px, voile
       sombre en bas, le titre en capitales pose dessus ;
     - des champs en verre (blanc 16 %, flou 14px, contour blanc 28 %) ;
     - une pilule acide sous la photo : l'element acide dominant.
   Palette stricte : #141414 #434343 #FFFFFF #A2FF01 (+ #909090 derive,
   + #E5484D reserve aux erreurs). Mono-theme sombre assume.
   La photo au col bleu des assets est ECARTEE : le bleu sort de la palette.
   ------------------------------------------------------------------ */
:root {
  color-scheme: dark;
  --fond: #141414;
  --planche: #0C0C0C;
  --surface: #1C1C1C;
  --surface-2: #242424;
  --trait: #2E2E2E;
  --gris: #434343;
  --encre: #FFFFFF;
  --sourd: #909090;
  --acide: #A2FF01;
  --encre-acide: #141414;
  --erreur: #E5484D;
  --verre: rgba(255, 255, 255, .16);
  --verre-bord: rgba(255, 255, 255, .28);
  --sortie: cubic-bezier(.23, 1, .32, 1);
  --tiroir: cubic-bezier(.32, .72, 0, 1);
  --titre: "Archivo", "Outfit", ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--planche); }
body {
  margin: 0; color: var(--encre);
  font-family: "Outfit", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acide); outline-offset: 2px; }

/* ================= la page autour du telephone ================= */
.page {
  max-width: 1080px; margin: 0 auto; padding: 28px 20px 56px;
  display: grid; grid-template-columns: auto 1fr; gap: 48px; align-items: start;
}
.cote { display: grid; gap: 22px; padding-top: 8px; }
.cote h1 { margin: 0; font-family: var(--titre); font-weight: 900; font-stretch: 72%; letter-spacing: -0.02em; line-height: .95; font-size: clamp(34px, 4.6vw, 52px); text-transform: uppercase; }
.cote p { margin: 0; color: var(--sourd); max-width: 58ch; }
.cote p b { color: var(--encre); font-weight: 500; }
.parcours { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.parcours button {
  width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center;
  padding: 10px 12px; border-radius: 14px; border: 0; background: none; cursor: pointer; text-align: left;
  color: var(--sourd); transition: background 160ms var(--sortie);
}
.parcours button:hover { background: var(--surface); color: var(--encre); }
.parcours .num { width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 600; border: 1px solid var(--trait); }
.parcours .fait .num { background: var(--gris); border-color: var(--gris); color: var(--encre); }
.parcours .ici { background: var(--surface); color: var(--encre); }
.parcours .ici .num { background: var(--acide); border-color: var(--acide); color: var(--encre-acide); }
.parcours .saute { opacity: .45; }
.parcours small { font-size: 12px; }
.notes { border-top: 1px solid var(--trait); padding-top: 16px; display: grid; gap: 8px; font-size: 13px; color: var(--sourd); max-width: 58ch; }
.notes b { color: var(--encre); font-weight: 500; }
.recommencer { justify-self: start; border: 1px solid var(--trait); background: none; border-radius: 999px; padding: 9px 16px; cursor: pointer; color: var(--encre); }
.recommencer:active { transform: scale(.97); }

/* ================= le telephone ================= */
.tel {
  width: 390px; height: 820px; border-radius: 56px; padding: 10px; flex: none;
  background: linear-gradient(145deg, #3a3a3a, #111 40%, #2a2a2a);
  box-shadow: 0 40px 80px -30px rgba(0,0,0,.85), inset 0 0 0 1px #4a4a4a;
  position: sticky; top: 20px;
}
.ecran {
  position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden;
  background: var(--fond); isolation: isolate;
}
.ecran::before {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: url("grain.png") repeat; background-size: 112px; opacity: .10; mix-blend-mode: overlay;
}
.barre {
  position: absolute; top: 0; left: 0; right: 0; z-index: 30; height: 50px;
  display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0;
  font-size: 14px; font-weight: 600; color: var(--encre); pointer-events: none;
}
.barre::after { content: ""; position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 110px; height: 32px; border-radius: 99px; background: #000; }
.barre .icones { display: flex; gap: 5px; align-items: center; }
.barre .icones i { display: block; width: 17px; height: 10px; border-radius: 3px; border: 1.5px solid currentColor; }
.indicateur { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 130px; height: 5px; border-radius: 9px; background: var(--encre); z-index: 30; pointer-events: none; }

/* un ecran du parcours */
.vue {
  position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 1;
  animation: entre 360ms var(--sortie) both;
}
.vue.retour { animation-name: entre-retour; }
@keyframes entre { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes entre-retour { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

/* la carte photo (constante de la grammaire) */
.photo {
  position: relative; flex: none; border-radius: 0 0 36px 36px; overflow: hidden;
  transition: height 420ms var(--tiroir);
}
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,20,20,.28) 0%, rgba(20,20,20,0) 26%, rgba(20,20,20,0) 42%, rgba(20,20,20,.80) 100%); }
.photo .dessus { position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; display: flex; flex-direction: column; gap: 12px; }
.photo .haut { position: absolute; top: 54px; left: 16px; right: 16px; z-index: 3; display: flex; align-items: center; gap: 12px; }
.titre {
  margin: 0; font-family: var(--titre); font-weight: 900; font-stretch: 72%;
  letter-spacing: -0.02em; line-height: .9; text-transform: uppercase; text-wrap: balance; color: var(--encre);
}
.surtitre { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.78); }

/* progression facon « stories » + retour */
.segments { flex: 1; display: flex; gap: 4px; }
.segments span { flex: 1; height: 3px; border-radius: 9px; background: rgba(255,255,255,.28); overflow: hidden; }
.segments span.fait { background: var(--encre); }
.segments span.ici { background: linear-gradient(90deg, var(--encre) 50%, rgba(255,255,255,.28) 50%); }
.rond-verre {
  width: 40px; height: 40px; border-radius: 99px; flex: none; display: grid; place-items: center; cursor: pointer;
  background: rgba(20,20,20,.35); border: 1px solid var(--verre-bord); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  font-size: 18px;
}
.rond-verre:active { transform: scale(.94); }

/* le verre */
.verre {
  height: 54px; border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 0 20px;
  background: var(--verre); border: 1px solid var(--verre-bord);
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
}
.verre input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 17px; letter-spacing: .02em; }
.verre input::placeholder { color: rgba(255,255,255,.55); }
.verre .indic { color: rgba(255,255,255,.72); font-weight: 500; }
.verre:focus-within { border-color: rgba(255,255,255,.6); }
.verre.erreur { border-color: var(--erreur); }

.segment { display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: rgba(20,20,20,.55); align-self: flex-start; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.12); }
.segment button { border: 0; border-radius: 999px; padding: 8px 16px; font-size: 12px; font-weight: 700; letter-spacing: .05em; background: none; cursor: pointer; transition: background 160ms, color 160ms; }
.segment button[aria-pressed="true"] { background: var(--acide); color: var(--encre-acide); }

/* le bas de l'ecran */
.bas { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 18px 18px 30px; min-height: 0; }
.bas.defile { overflow-y: auto; scrollbar-width: none; }
.bas.defile::-webkit-scrollbar { display: none; }
.pousse { flex: 1; }
.pilule {
  flex: none; height: 56px; border-radius: 999px; border: 0; cursor: pointer; font-weight: 600; font-size: 16px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 140ms var(--sortie), opacity 160ms;
}
.pilule:active { transform: scale(.97); }
.pilule.acide { background: var(--acide); color: var(--encre-acide); }
.pilule.contour { background: none; border: 1px solid var(--gris); }
.pilule:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.lien { background: none; border: 0; color: var(--sourd); font-size: 14px; cursor: pointer; padding: 6px; align-self: center; }
.lien:hover { color: var(--encre); }
.mention { margin: 0; font-size: 11.5px; color: var(--sourd); text-align: center; line-height: 1.45; }
.mention u { color: var(--encre); text-decoration: none; }
.aide { margin: 0; font-size: 13px; color: var(--sourd); }
.aide b { color: var(--encre); font-weight: 500; }
.message-erreur { margin: 0; font-size: 13px; color: var(--erreur); min-height: 1.2em; }

/* cases du code, en verre sur le sol sombre */
.cases { display: grid; gap: 8px; }
.cases .case {
  height: 60px; border-radius: 18px; display: grid; place-items: center; font-size: 24px; font-weight: 600;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
  transition: border-color 160ms, background 160ms;
}
.cases .case.vide { color: rgba(255,255,255,.3); }
.cases .case.ici { border-color: var(--encre); }
.cases.erreur .case { border-color: var(--erreur); animation: secoue 320ms var(--sortie); }
.cases.pin .case { font-size: 30px; }
@keyframes secoue { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

.clavier { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; }
.clavier button {
  height: 58px; border-radius: 999px; border: 1px solid var(--trait); background: none; cursor: pointer;
  font-size: 24px; transition: background 120ms, transform 120ms var(--sortie);
}
.clavier button:active { transform: scale(.94); background: var(--surface-2); }
.clavier button.muet { border-color: transparent; font-size: 15px; color: var(--sourd); }

/* options (profil, regimes, pieces) */
.options { display: grid; gap: 10px; }
.option {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left;
  padding: 16px 18px; border-radius: 24px; cursor: pointer; border: 1px solid var(--trait); background: var(--surface);
  transition: border-color 160ms, background 160ms, transform 140ms var(--sortie);
}
.option:active { transform: scale(.98); }
.option b { font-weight: 600; font-size: 16px; }
.option span { grid-column: 1; color: var(--sourd); font-size: 13px; line-height: 1.35; }
.option .prix { grid-row: 1 / span 2; grid-column: 2; font-size: 13px; font-weight: 600; color: var(--encre); text-align: right; line-height: 1.2; }
.option .prix small { display: block; color: var(--sourd); font-weight: 400; }
.option[aria-checked="true"] { border-color: var(--encre); background: var(--surface-2); }
.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce { border: 1px solid var(--trait); background: none; border-radius: 999px; padding: 9px 15px; cursor: pointer; font-size: 14px; }
.puce[aria-checked="true"] { background: var(--encre); color: var(--fond); border-color: var(--encre); font-weight: 600; }

/* comptes relies */
.ligne { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--trait); }
.ligne .point { width: 10px; height: 10px; border-radius: 99px; flex: none; }
.ligne .nom { flex: 1; min-width: 0; font-weight: 500; }
.ligne .nom small { display: block; color: var(--sourd); font-weight: 400; font-size: 12.5px; }
.ligne .action { border: 1px solid var(--gris); background: none; border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; flex: none; }
.ligne .action.relie { border-color: transparent; background: var(--surface-2); color: var(--encre); }
.ligne .action.relie::before { content: "✓ "; color: var(--acide); }
.p-orange { background: #FF7900; } .p-mtn { background: #FFCB05; } .p-moov { background: #0066B3; } .p-wave { background: #1DC4FF; } .p-banque { background: var(--encre); }
.groupe-titre { margin: 8px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sourd); }

/* feuille (panneau qui monte, dans le telephone) */
.voile { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.55); opacity: 0; transition: opacity 240ms var(--sortie); }
.voile.ouvert { opacity: 1; }
.feuille {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface);
  border-radius: 32px 32px 0 0; border-top: 1px solid var(--trait);
  padding: 10px 18px 34px; display: flex; flex-direction: column; gap: 12px;
  transform: translateY(105%); transition: transform 300ms var(--tiroir);
}
.feuille.ouverte { transform: none; }
.feuille .poignee { width: 40px; height: 5px; border-radius: 9px; background: var(--gris); align-self: center; margin-bottom: 4px; }
.feuille h3 { margin: 0; font-size: 20px; font-weight: 600; }
.champ { display: grid; gap: 6px; }
.champ label { font-size: 13px; color: var(--sourd); }
.saisie {
  height: 52px; border-radius: 16px; border: 1px solid var(--trait); background: var(--fond); padding: 0 16px;
  font-size: 16px; outline: 0; width: 100%; letter-spacing: .02em;
}
.saisie:focus { border-color: var(--sourd); }
.saisie.erreur { border-color: var(--erreur); }

/* piece d'identite */
.faces { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.faces.une { grid-template-columns: 1fr; }
.face {
  position: relative; aspect-ratio: 1.58; border-radius: 20px; border: 1.5px dashed var(--gris); background: var(--surface);
  display: grid; place-items: center; text-align: center; cursor: pointer; overflow: hidden; font-size: 13px; color: var(--sourd);
}
.face b { display: block; color: var(--encre); font-weight: 600; font-size: 14px; }
.face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.face.pleine { border-style: solid; border-color: var(--encre); }
.face.pleine::after { content: "✓"; position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 99px; background: var(--acide); color: var(--encre-acide); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.face input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* la consequence fiscale : l'etat se lit dans la forme */
.consequence { border-radius: 20px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--trait); font-size: 13px; color: var(--sourd); }
.consequence b { color: var(--encre); font-weight: 600; }
.consequence .code { display: inline-block; font-weight: 700; color: var(--encre-acide); background: var(--encre); border-radius: 6px; padding: 1px 7px; margin-right: 6px; font-size: 12px; letter-spacing: .04em; }

/* interrupteur */
.interrupteur { width: 50px; height: 30px; border-radius: 99px; border: 0; cursor: pointer; position: relative; flex: none; background: var(--gris); transition: background 180ms var(--sortie); }
.interrupteur::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 99px; background: var(--encre); transition: transform 220ms var(--sortie); }
.interrupteur[aria-pressed="true"] { background: var(--acide); }
.interrupteur[aria-pressed="true"]::after { transform: translateX(20px); background: var(--fond); }

/* recapitulatif final */
.recap { display: grid; gap: 0; background: var(--verre); border: 1px solid var(--verre-bord); border-radius: 26px; padding: 6px 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.recap div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.14); font-size: 14px; }
.recap div:last-child { border-bottom: 0; }
.recap span { color: rgba(255,255,255,.72); }
.recap b { font-weight: 600; text-align: right; }
.echelle { display: flex; gap: 4px; }
.echelle span { flex: 1; height: 4px; border-radius: 9px; background: rgba(255,255,255,.22); }
.echelle span.fait { background: var(--acide); }
.echelle-lib { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,.6); margin-top: 6px; }
.echelle-lib b { color: var(--encre); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0ms !important; transition-duration: 0ms !important; }
}
@media (max-width: 900px) {
  .page { grid-template-columns: 1fr; justify-items: center; gap: 28px; }
  .cote { order: -1; }
  .tel { position: relative; top: 0; }
}
@media (max-width: 440px) {
  .page { padding-inline: 16px; }
  .tel { width: 100%; height: 780px; border-radius: 40px; padding: 7px; }
  .ecran { border-radius: 34px; }
}
</style>
<style>
/* ================= le hero de l'app : la couleur, pas la photo =================
   Decision de LO (28/09/2026) : la personne de l'onboarding n'est pas le hero
   de l'app. On revient au hero deux tons valide le 28/08 : rampe acide, voile
   radial qui donne le volume, grain, encre #141414 (8,02:1 sur l'arret le plus
   sombre, mesure a l'epoque). Tout le reste de l'ecran reste noir.
   L'acide dominant de chaque ecran est donc le HERO : les boutons principaux
   passent en blanc pour ne pas lui faire concurrence. */
:root { --grad-hero: linear-gradient(158deg, #6FBF00 0%, #8FE500 16%, #A2FF01 42%, #BFFF2E 68%, #E2FF8C 92%, #F2FFC4 100%);
  --voile-hero: radial-gradient(118% 80% at 86% 2%, rgba(255,255,255,.30), transparent 62%), radial-gradient(92% 72% at 6% 98%, rgba(60,120,0,.30), transparent 58%); }
.photo.hero-acide { background: var(--grad-hero); color: var(--encre-acide); }
.photo.hero-acide::after { background: var(--voile-hero); }
.photo.hero-acide::before { content: ""; position: absolute; inset: 0; background: url("grain.png") repeat; background-size: 112px; opacity: .22; mix-blend-mode: multiply; pointer-events: none; }
.hero-acide .titre { color: var(--encre-acide); }
.hero-acide .surtitre { color: rgba(20,20,20,.66); }
.hero-acide .rond-verre, .hero-acide .avatar { background: rgba(20,20,20,.08); border-color: rgba(20,20,20,.18); color: var(--encre-acide); }
.hero-acide .salut { text-shadow: none; color: var(--encre-acide); }
.hero-acide .plaque { background: rgba(255,255,255,.36); border-color: rgba(255,255,255,.55); color: var(--encre-acide); }
.hero-acide .plaque .ligne-plaque, .hero-acide .oeil { color: rgba(20,20,20,.72); }
.hero-acide .recap { background: rgba(255,255,255,.36); border-color: rgba(255,255,255,.55); }
.hero-acide .recap div { border-bottom-color: rgba(20,20,20,.12); }
.hero-acide .recap span { color: rgba(20,20,20,.66); }
.hero-acide .recap b { color: var(--encre-acide); }
.hero-acide .verre { background: rgba(255,255,255,.36); border-color: rgba(255,255,255,.6); color: var(--encre-acide); }
.hero-acide .verre input { color: var(--encre-acide); }
.hero-acide .verre input::placeholder { color: rgba(20,20,20,.5); }
.hero-acide .verre .indic { color: rgba(20,20,20,.66); }
.ecran.app .barre { color: var(--encre-acide); }
.pilule.blanche { background: var(--encre); color: var(--fond); }

/* le choix de la cible : deux grandes options, chacune avec ses sous-options */
.cibles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cible { border: 1px solid var(--trait); background: var(--surface); border-radius: 26px; padding: 18px 16px; text-align: left; cursor: pointer; display: grid; gap: 14px; min-height: 150px; align-content: space-between; transition: transform 140ms var(--sortie), border-color 160ms; }
.cible:active { transform: scale(.97); }
.cible[aria-checked="true"] { border-color: var(--encre); background: var(--surface-2); }
.cible .ico { width: 44px; height: 44px; border-radius: 99px; display: grid; place-items: center; background: var(--surface-2); }

const formateTel = (s) => chiffres(s).slice(0, 10).replace(/(\d{2})(?=\d)/g, "$1 ");
const echappe = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function etapes() {
  if (E.mode === "connexion") return ["bienvenue", "code", "pin", "pret"];
  const l = ["bienvenue", "code", "profil", "comptes", "piece"];
  if (E.profil && E.profil !== "particulier") l.push("entreprise");
  l.push("pin", "pret");
  return l;
}
const LIBELLES = {
  bienvenue: ["Bienvenue", "Numéro et consentement"],
  code: ["Code SMS", "6 chiffres, renvoi à 0:42"],
  profil: ["Profil", "Particulier, commerçant ou entreprise"],
  comptes: ["Ajouter ses comptes", "Déclarés par vous, confirmés à la 1re recharge"],
  piece: ["Pièce d'identité", "CNI, passeport ou carte consulaire"],
  entreprise: ["Entreprise", "NCC et régime fiscal, pour la FNE"],
  pin: ["Code secret", "4 chiffres, confirmés"],
  pret: ["C'est prêt", "Récapitulatif et palier atteint"],
};
function palier() {
  if (E.mode === "connexion") return 2;
  let p = E.vus.has("profil") ? 2 : 1;
  if (piecePrete()) p = 3;
  if (p === 3 && E.ent.regime && nccValide(E.ent.ncc)) p = 4;
  return p;
}
const nccValide = (v) => /^\d{7}[A-Z]$/.test(v.trim().toUpperCase());
const piecePrete = () => PIECES[E.piece.type].faces.every((f) => E.piece.faces[f]);

/* ============================ navigation ============================ */
let sens = "avant";
function aller(cle, retour = false) {
  sens = retour ? "retour" : "avant";
  E.ici = cle; E.vus.add(cle);
  fermerFeuille();
  rendre();
}
function suivant() { const l = etapes(); aller(l[Math.min(l.indexOf(E.ici) + 1, l.length - 1)]); }
function precedent() { const l = etapes(); const i = l.indexOf(E.ici); if (i > 0) aller(l[i - 1], true); }

/* ============================ briques ============================ */
function carteHaut(hauteur, cadrage, titre, surtitre = "") {
  const l = etapes(), i = l.indexOf(E.ici);
  const segs = l.map((_, k) => "<span class='" + (k < i ? "fait" : k === i ? "ici" : "") + "'></span>").join("");
  const retour = i > 0 && E.ici !== "pret"
    ? "<button class='rond-verre' data-precedent aria-label='Retour'>←</button>" : "";
  return "<div class='photo' style='height:" + hauteur + "'><img src='photo.jpg' alt='' style='object-position:" + cadrage + "'>" +
    "<div class='haut'>" + retour + "<div class='segments' aria-label='Étape " + (i + 1) + " sur " + l.length + "'>" + segs + "</div></div>" +
    "<div class='dessus'>" + (surtitre ? "<span class='surtitre'>" + surtitre + "</span>" : "") + titre + "</div></div>";
}
function clavier(extra) {
  return "<div class='clavier'>" + ["1","2","3","4","5","6","7","8","9", extra, "0", "effacer"].map((t) =>
    t === "effacer" ? "<button class='muet' data-touche='effacer' aria-label='Effacer'>⌫</button>"
    : t === "coller" ? "<button class='muet' data-touche='coller'>Coller</button>"
    : t === "" ? "<span></span>"
    : "<button data-touche='" + t + "'>" + t + "</button>").join("") + "</div>";
}
function cases(n, valeurs, masque, erreur, pin) {
  return "<div class='cases" + (erreur ? " erreur" : "") + (pin ? " pin" : "") + "' style='grid-template-columns:repeat(" + n + ",1fr)'>" +
    Array.from({ length: n }, (_, i) => {
      const v = valeurs[i];
      return "<span class='case" + (v === undefined ? " vide" : "") + (i === valeurs.length ? " ici" : "") + "'>" +
        (v === undefined ? "•" : masque ? "●" : v) + "</span>";
    }).join("") + "</div>";
}

/* ============================ feuilles ============================ */
const feuille = document.getElementById("feuille");
const voile = document.getElementById("voile");
let F = null;
function ouvrirFeuille(html, etat) {
  F = etat;
  feuille.innerHTML = "<div class='poignee'></div>" + html;
  voile.hidden = false;
  requestAnimationFrame(() => { voile.classList.add("ouvert"); feuille.classList.add("ouverte"); });
  const premier = feuille.querySelector("input, button:not(.lien)");
  if (premier) setTimeout(() => premier.focus({ preventScroll: true }), 320);
}
function fermerFeuille() {
  F = null;
  voile.classList.remove("ouvert"); feuille.classList.remove("ouverte");
  setTimeout(() => { if (!F) voile.hidden = true; }, 260);
}
voile.addEventListener("click", fermerFeuille);

function feuilleReseau(k) {
  const l = LIGNES[k];
  const defaut = E.relie[k] || (l.prefixe && chiffres(E.tel).startsWith(l.prefixe) ? E.tel : k === "wave" ? E.tel : "");
  const etat = { k, num: defaut, envoye: false, code: [], erreur: "" };
  const dessiner = () => {
    const html =
      "<h3 id='feuille-titre'>Relier " + l.nom + "</h3>" +
      "<div class='champ'><label for='f-num'>Numéro " + l.nom + "</label><input class='saisie" + (etat.erreur ? " erreur" : "") + "' id='f-num' inputmode='numeric' value='" + etat.num + "' placeholder='" + (l.prefixe ? l.prefixe + " 00 00 00 00" : "07 00 00 00 00") + "' " + (etat.envoye ? "disabled" : "") + "></div>" +
      "<p class='message-erreur' style='margin-top:-6px'>" + (etat.erreur || "") + "</p>" +
      (etat.envoye
        ? "<p class='aide' style='margin-top:-8px'>Code envoyé au <b>" + etat.num + "</b></p>" + cases(6, etat.code, false, false) +
          "<div style='display:flex;gap:10px'><button class='pilule contour' style='flex:1' data-f-coller>Coller le code</button><button class='pilule acide' style='flex:1' data-f-relier " + (etat.code.length === 6 ? "" : "disabled") + ">Relier</button></div>"
        : "<p class='aide' style='margin-top:-8px'>" + l.aide + "</p><button class='pilule acide' data-f-envoyer>Ajouter ce compte</button>") +
      "<button class='lien' data-f-fermer>Annuler</button>";
    if (F === etat) { feuille.innerHTML = "<div class='poignee'></div>" + html; brancherFeuille(); }
    else { ouvrirFeuille(html, etat); brancherFeuille(); }
  };
  const brancherFeuille = () => {
    const inp = feuille.querySelector("#f-num");
    inp.addEventListener("input", () => { inp.value = formateTel(inp.value); etat.num = inp.value; });
    feuille.querySelector("[data-f-fermer]").addEventListener("click", fermerFeuille);
    const env = feuille.querySelector("[data-f-envoyer]");
    if (env) env.addEventListener("click", () => {
      const c = chiffres(etat.num);
      if (c.length !== 10) { etat.erreur = "Le numéro compte 10 chiffres."; return dessiner(); }
      if (l.prefixe && !c.startsWith(l.prefixe)) { etat.erreur = "Ce numéro n'est pas une ligne " + l.nom.split(" ")[0] + ". " + l.aide; return dessiner(); }
      /* LO, 28/09 : pas de SMS par portefeuille. L'utilisateur declare ses comptes,
         il en est le garant ; la premiere recharge les confirme (l'operateur
         demande alors son code au titulaire). */
      E.relie[k] = etat.num; fermerFeuille(); rendre();
    });
    const col = feuille.querySelector("[data-f-coller]");
    if (col) col.addEventListener("click", () => { etat.code = [..."613408"]; dessiner(); });
    const rel = feuille.querySelector("[data-f-relier]");
    if (rel) rel.addEventListener("click", () => { E.relie[k] = etat.num; fermerFeuille(); rendre(); });
  };
  dessiner();
}
function feuilleBanque() {
  const etat = { rib: E.banque || "CI008 01234 012345678901 23", erreur: "" };
  const dessiner = () => {
    const html =
      "<h3 id='feuille-titre'>Ajouter un compte bancaire</h3>" +
      "<div class='champ'><label for='f-rib'>RIB (24 caractères)</label><input class='saisie" + (etat.erreur ? " erreur" : "") + "' id='f-rib' value='" + etat.rib + "' autocapitalize='characters'></div>" +
      "<p class='message-erreur' style='margin-top:-6px'>" + etat.erreur + "</p>" +
      "<p class='aide' style='margin-top:-8px'>Le compte doit être à votre nom.</p>" +
      "<button class='pilule acide' data-f-ok>Ajouter le compte</button><button class='lien' data-f-fermer>Plus tard</button>";
    if (F === etat) feuille.innerHTML = "<div class='poignee'></div>" + html; else ouvrirFeuille(html, etat);
    const inp = feuille.querySelector("#f-rib");
    inp.addEventListener("input", () => { etat.rib = inp.value.toUpperCase(); });
    feuille.querySelector("[data-f-fermer]").addEventListener("click", fermerFeuille);
    feuille.querySelector("[data-f-ok]").addEventListener("click", () => {
      const brut = etat.rib.replace(/\s/g, "");
      if (!/^[A-Z]{2}[0-9A-Z]{22}$/.test(brut)) { etat.erreur = "Un RIB compte 24 caractères : code banque, guichet, compte et clé."; return dessiner(); }
      E.banque = brut; fermerFeuille(); rendre();
    });
  };
  dessiner();
}

/* ============================ rendu et branchements ============================ */
const hote = document.getElementById("vue-hote");
function rendre() {
  hote.innerHTML = "<section class='vue" + (sens === "retour" ? " retour" : "") + "'>" + ECRANS[E.ici]() + "</section>";
  sens = "avant";
  brancher();
  rendreParcours();
}
function brancher() {
  const v = hote.firstElementChild;
  v.querySelectorAll("[data-precedent]").forEach((b) => b.addEventListener("click", precedent));
  v.querySelectorAll("[data-suivant]").forEach((b) => b.addEventListener("click", suivant));
  v.querySelectorAll("[data-suivant-force]").forEach((b) => b.addEventListener("click", suivant));
  v.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { E.mode = b.dataset.mode; rendre(); }));
  const tel = v.querySelector("#tel");
  if (tel) tel.addEventListener("input", () => {
    tel.value = formateTel(tel.value); E.tel = tel.value;
    v.querySelector("[data-envoyer]").disabled = chiffres(E.tel).length !== 10;
  });

/* ============================ feuilles ============================ */
const feuille = document.getElementById("feuille");
const voile = document.getElementById("voile");
let FE = null;
function ouvrirFeuille(html, etat) {
  FE = etat || {};
  feuille.innerHTML = "<div class='poignee'></div>" + html;
  voile.hidden = false;
  requestAnimationFrame(() => { voile.classList.add("ouvert"); feuille.classList.add("ouverte"); });
}
function fermerFeuille() {
  FE = null; voile.classList.remove("ouvert"); feuille.classList.remove("ouverte");
  setTimeout(() => { if (!FE) voile.hidden = true; }, 260);
}
voile.addEventListener("click", fermerFeuille);

function feuilleCode(apres) {
  E.pin = [];
  const dessiner = () => {
    feuille.innerHTML = "<div class='poignee'></div><h3 id='feuille-titre'>Votre code secret</h3>" + cases(4, E.pin) + clavier("", true) + "<button class='lien' data-f-fermer>Annuler</button>";
    feuille.querySelector("[data-f-fermer]").addEventListener("click", fermerFeuille);
    feuille.querySelectorAll("[data-touche]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.touche === "effacer") E.pin.pop(); else if (E.pin.length < 4) E.pin.push(b.dataset.touche);
      dessiner();
      if (E.pin.length === 4) setTimeout(() => { fermerFeuille(); apres(); }, 260);
    }));
  };
  ouvrirFeuille("", { code: true }); dessiner();
}
function feuilleOp(id) {
  const o = E.ops.find((x) => x.id === Number(id));
  const signe = o.type === "sortie" ? "−" : "+";
  const lignes =

function cases(n, valeurs) {

}

function opLigne(o) {

function qrSvg(graine) {
  /* motif deterministe : un QR de MAQUETTE, qui ne se scanne pas */
  let x = graine * 9301 + 49297, cellules = "";
  const n = 25, marque = (cx, cy) => "<rect x='" + cx + "' y='" + cy + "' width='7' height='7' fill='none' stroke='currentColor' stroke-width='1'/><rect x='" + (cx + 2) + "' y='" + (cy + 2) + "' width='3' height='3'/>";
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const coin = (i < 8 && j < 8) || (i < 8 && j > n - 9) || (i > n - 9 && j < 8);
    x = (x * 1103515245 + 12345) & 0x7fffffff;
    if (!coin && x % 100 < 47) cellules += "<rect x='" + j + "' y='" + i + "' width='1' height='1'/>";
  }
  return "<svg viewBox='-1 -1 27 27' fill='currentColor' aria-hidden='true'>" + cellules + marque(0.5, 0.5) + marque(17.5, 0.5) + marque(0.5, 17.5) + "</svg>";
}

const numero = () => choix(["07", "05", "01"]) + " " + Array.from({ length: 4 }, () => String(Math.floor(alea() * 100)).padStart(2, "0")).join(" ");

  const L = [];
  for (let i = 0; i < n; i++) {
    let r = alea(), c = 0, g = GROUPES[0];
    for (const x of GROUPES) { c += x[3]; if (r <= c) { g = x; break; } }
    const base = Math.round((g[1] + alea() * (g[2] - g[1])) / 500) * 500;
    const s = { mat: "GA-" + (1001 + i), nom: choix(PRENOMS) + " " + choix(NOMS), groupe: g[0], tel: numero(), net: base, avant: base, etat: "pret", pb: null, ok: false };

        { txt: "Numéro invalide", det: "9 chiffres au lieu de 10", court: true },
      ]);
      if (s.pb.court) s.tel = s.tel.slice(0, -1);
    }
    const v = alea();
    if (v < .004) s.net = Math.round(base * (1.22 + alea() * .2) / 500) * 500;
    else if (v < .12) s.net = base + choix([5000, 10000, 15000, -5000, 20000]);
    L.push(s);
  }
  L[417].tel = L[88].tel; L[417].etat = "verifier"; L[417].pb = { txt: "Numéro en double", det: "Même numéro que " + L[88].nom };
  return L;
}

const SYN = {
  nom: ["employé", "employe", "salarié", "salarie", "nom", "nom complet", "name", "employee", "beneficiaire", "bénéficiaire"],
  matricule: ["matricule", "id", "référence", "reference", "badge"],
  telephone: ["téléphone portable", "telephone portable", "téléphone", "telephone", "mobile", "portable", "tel", "phone", "numéro", "numero"],
  net: ["net à payer", "net a payer", "net", "salaire net", "montant", "net_wage", "à payer", "amount"],
};
const plat = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
function lireCsv(t) {
  const p = t.split(/\r?\n/)[0] || "";
  const sep = [";", ",", "\t"].map((c) => [c, p.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const lignes = []; let cur = [], ch = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { ch += '"'; i++; } else q = false; } else ch += c; }
    else if (c === '"') q = true;
    else if (c === sep) { cur.push(ch); ch = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; cur.push(ch); ch = ""; if (cur.some((x) => x.trim())) lignes.push(cur); cur = []; }
    else ch += c;
  }
  cur.push(ch); if (cur.some((x) => x.trim())) lignes.push(cur);
  const ent = lignes.shift() || [];
  const carte = {};
  for (const [k, syn] of Object.entries(SYN)) {
    const i = ent.findIndex((h) => syn.map(plat).includes(plat(h)));
    carte[k] = i >= 0 ? { i, entete: ent[i] } : null;
  }
  return { lignes, carte };
}
function depuisCsv(f) {
  graine = 99;
  const g = (l, k) => f.carte[k] ? (l[f.carte[k].i] || "").trim() : "";
  return f.lignes.map((l, i) => {
    const t = g(l, "telephone").replace(/\D/g, "").replace(/^225/, "");
    const net = Math.round(Number(g(l, "net").replace(/\s/g, "").replace(/[^\d,.-]/g, "").replace(",", ".")) || 0);
    const s = { mat: g(l, "matricule") || "Ligne " + (i + 2), nom: g(l, "nom") || "Sans nom", groupe: "—", tel: t.replace(/(\d{2})(?=\d)/g, "$1 "), net, avant: net, etat: alea() < .86 ? "pret" : "invite", pb: null, ok: false };
    if (t.length !== 10) { s.etat = "verifier"; s.pb = { txt: "Numéro invalide", det: t.length + " chiffres au lieu de 10" }; }
    else if (!["07", "05", "01"].includes(t.slice(0, 2))) { s.etat = "verifier"; s.pb = { txt: "Préfixe inconnu", det: "Un numéro ivoirien commence par 07, 05 ou 01" }; }
    else if (!net) { s.etat = "verifier"; s.pb = { txt: "Montant manquant", det: "Le net à payer est vide" }; }
    return s;
  });
}

function compte() {
  const L = E.salaries;
  const pret = L.filter((s) => s.etat === "pret").length;
  const invite = L.filter((s) => s.etat === "invite").length;
  const verifier = L.filter((s) => s.etat === "verifier" && !s.ok).length;
  const ecarts = L.filter((s) => ecartFort(s) && !s.ok && s.etat !== "verifier").length;
  const total = L.filter((s) => !(s.etat === "verifier" && !s.ok)).reduce((a, s) => a + s.net, 0);
  const tout = L.reduce((a, s) => a + s.net, 0);
  const aPayer = L.filter((s) => s.etat === "pret").reduce((a, s) => a + s.net, 0);
  const reserve = L.filter((s) => s.etat === "invite").reduce((a, s) => a + s.net, 0);
  const avant = L.reduce((a, s) => a + s.avant, 0);
  return { n: L.length, pret, invite, verifier, ecarts, total, tout, aPayer, reserve, avant, frais: Math.round(total * TAUX_PAIE_BP / 10000), aRegarder: L.filter(aRegarder).length };
}

let sens = "avant", dernier = null;
function aller(e, o = {}) {
  if (!o.remplacer) E.pile.push(E.ecran);
  if (e === "accueil") E.pile = [];
  sens = o.retour ? "retour" : "avant";
  E.ecran = e; clearInterval(vif); vif = null; fermerFeuille(); rendre();
  if (e === "beneficiaires") demarrerVif();
}
function retour() { const p = E.pile.pop() || "accueil"; sens = "retour"; E.ecran = p; clearInterval(vif); vif = null; fermerFeuille(); rendre(); if (p === "beneficiaires") demarrerVif(); }
