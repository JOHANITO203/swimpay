x-swimpay-runtime-env: &swimpay_runtime_env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL from external secret storage}
  VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
  NATS_URL: ${NATS_URL:-nats://nats:4222}
  NATS_STREAM_NAME: ${NATS_STREAM_NAME:-SWIMPAY_EVENTS}
  NATS_DURABLE_PREFIX: ${NATS_DURABLE_PREFIX:-swimpay}
  NATS_CONNECT_TIMEOUT_MS: ${NATS_CONNECT_TIMEOUT_MS:-2000}
  ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-signed_token}
  DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:-}
  DEV_ADMIN_OPERATOR_ID: ${DEV_ADMIN_OPERATOR_ID:-}
  DEV_ADMIN_ROLE: ${DEV_ADMIN_ROLE:-}
  ADMIN_TOKEN_HMAC_SECRET: ${ADMIN_TOKEN_HMAC_SECRET:?set ADMIN_TOKEN_HMAC_SECRET from external secret storage}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
  SWIMPAY_ANDROID_GOOGLE_SERVER_CLIENT_ID: ${SWIMPAY_ANDROID_GOOGLE_SERVER_CLIENT_ID:-}
  SWIMPAY_ANDROID_STAGING_GOOGLE_SERVER_CLIENT_ID: ${SWIMPAY_ANDROID_STAGING_GOOGLE_SERVER_CLIENT_ID:-}
  CHECKOUT_BASE_URL: ${CHECKOUT_BASE_URL:?set CHECKOUT_BASE_URL to the public checkout URL}
  PHONE_HMAC_SECRET: ${PHONE_HMAC_SECRET:?set PHONE_HMAC_SECRET from external secret storage}
  WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set WEBHOOK_SECRET_ENCRYPTION_KEY from external secret storage}
  WEBHOOK_WORKER_ENABLED: ${WEBHOOK_WORKER_ENABLED:-false}
  WEBHOOK_POLL_INTERVAL_MS: ${WEBHOOK_POLL_INTERVAL_MS:-30000}
  WEBHOOK_WORKER_BATCH_SIZE: ${WEBHOOK_WORKER_BATCH_SIZE:-10}
  WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-7}
  WEBHOOK_REQUEST_TIMEOUT_MS: ${WEBHOOK_REQUEST_TIMEOUT_MS:-5000}
  WEBHOOK_RETRY_BASE_DELAY_MS: ${WEBHOOK_RETRY_BASE_DELAY_MS:-60000}
  WEBHOOK_RETRY_MAX_DELAY_MS: ${WEBHOOK_RETRY_MAX_DELAY_MS:-86400000}
  NO_NOTIFICATION_FALLBACK_WORKER_ENABLED: ${NO_NOTIFICATION_FALLBACK_WORKER_ENABLED:-true}
  NO_NOTIFICATION_FALLBACK_MIN_SECONDS: ${NO_NOTIFICATION_FALLBACK_MIN_SECONDS:-120}
  NO_NOTIFICATION_FALLBACK_POLL_INTERVAL_MS: ${NO_NOTIFICATION_FALLBACK_POLL_INTERVAL_MS:-30000}
  NO_NOTIFICATION_FALLBACK_BATCH_SIZE: ${NO_NOTIFICATION_FALLBACK_BATCH_SIZE:-25}
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-3000}
  SIGNAL_WORKER_HEALTH_PORT: ${SIGNAL_WORKER_HEALTH_PORT:-3010}
  JOB_WORKER_HEALTH_PORT: ${JOB_WORKER_HEALTH_PORT:-3011}
  WEB_HOST: ${WEB_HOST:-0.0.0.0}
  WEB_PORT: ${WEB_PORT:-3001}
  API_BASE_URL: ${API_BASE_URL:-http://swimpay-api:3000}
  CHECKOUT_MERCHANT_ID: ${CHECKOUT_MERCHANT_ID:-mch_dev}
  MERCHANT_INTEGRATION_BEARER_TOKEN: ${MERCHANT_INTEGRATION_BEARER_TOKEN:-}
  SWIMPAY_ALLOW_DEV_MERCHANT_SESSION: ${SWIMPAY_ALLOW_DEV_MERCHANT_SESSION:-false}
  SWIMPAY_ADMIN_TOKEN: ${SWIMPAY_ADMIN_TOKEN:-}

services:
  proxy:
    image: caddy:2.8-alpine
    container_name: swimpay-proxy
    restart: unless-stopped
    depends_on:
      swimpay-api:
        condition: service_healthy
      swimpay-landing:
        condition: service_healthy
      swimpay-web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SWIMPAY_CADDY_SITE_ADDRESS: ${SWIMPAY_CADDY_SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - swimpay_runtime
      - swimpay_public
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &default_logging
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    mem_limit: 128m

  postgres:
    image: postgres:16-alpine
    container_name: swimpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swimpay}
      POSTGRES_USER: ${POSTGRES_USER:-swimpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD from external secret storage}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../packages/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - swimpay_runtime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 512m

  valkey:
    image: valkey/valkey:8-alpine
    container_name: swimpay-valkey
    restart: unless-stopped
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    volumes:
      - valkey_data:/data
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    networks:
      - swimpay_runtime
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 192m

  nats:
    image: nats:2.10-alpine
    container_name: swimpay-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - swimpay_runtime
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 192m

  swimpay-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped

    environment:
      <<: *swimpay_runtime_env
      SERVICE_NAME: swimpay-api
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
    expose:
      - "3000"
    networks:
      - swimpay_runtime
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 256m

  swimpay-signal-worker:
    build:
      context: ..
      dockerfile: apps/signal-worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *swimpay_runtime_env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
    expose:
      - "3010"
    networks:
      - swimpay_runtime
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 192m

  swimpay-job-worker:
    build:
      context: ..
      dockerfile: apps/job-worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *swimpay_runtime_env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
    expose:
      - "3011"
    networks:
      - swimpay_runtime
      - swimpay_public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 192m

  swimpay-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      <<: *swimpay_runtime_env
      API_BASE_URL: http://swimpay-api:3000
    depends_on:
      swimpay-api:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - swimpay_runtime
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 256m

  swimpay-landing:
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - swimpay_runtime
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 128m

networks:
  swimpay_runtime:
    driver: bridge
  swimpay_public:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_data:
  nats_data:
