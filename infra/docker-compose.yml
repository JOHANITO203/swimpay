services:
  proxy:
    image: caddy:2.8-alpine
    container_name: swimpay-proxy
    restart: unless-stopped
    depends_on:
      swimpay-api:
        condition: service_healthy
      swimpay-web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - swimpay_private
      - swimpay_public
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &default_logging
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    mem_limit: 128m

  postgres:
    image: postgres:16-alpine
    container_name: swimpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swimpay}
      POSTGRES_USER: ${POSTGRES_USER:-swimpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swimpay_dev_password}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../packages/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - swimpay_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 512m

  valkey:
    image: valkey/valkey:8-alpine
    container_name: swimpay-valkey
    restart: unless-stopped
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    volumes:
      - valkey_data:/data
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    networks:
      - swimpay_private
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 192m

  nats:
    image: nats:2.10-alpine
    container_name: swimpay-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - swimpay_private
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 192m

  swimpay-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../.env.example
    environment:
      SERVICE_NAME: swimpay-api
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
    expose:
      - "3000"
    networks:
      - swimpay_private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 256m

  swimpay-signal-worker:
    build:
      context: ..
      dockerfile: apps/signal-worker/Dockerfile
    restart: unless-stopped
    env_file: ../.env.example
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
    expose:
      - "3010"
    networks:
      - swimpay_private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 192m

  swimpay-job-worker:
    build:
      context: ..
      dockerfile: apps/job-worker/Dockerfile
    restart: unless-stopped
    env_file: ../.env.example
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
    expose:
      - "3011"
    networks:
      - swimpay_private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 192m

  swimpay-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: ../.env.example
    environment:
      API_BASE_URL: http://swimpay-api:3000
    depends_on:
      swimpay-api:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - swimpay_private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default_logging
    mem_limit: 256m

networks:
  swimpay_private:
    internal: true
  swimpay_public:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_data:
  nats_data:
