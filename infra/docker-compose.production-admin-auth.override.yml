services:
  swimpay-api:
    environment:
      NODE_ENV: production
      ADMIN_AUTH_MODE: signed_token
      ADMIN_TOKEN_HMAC_SECRET: ${ADMIN_TOKEN_HMAC_SECRET:?set ADMIN_TOKEN_HMAC_SECRET from external secret storage}
      DEV_ADMIN_TOKEN: ""
      DEV_ADMIN_OPERATOR_ID: ""
      DEV_ADMIN_ROLE: ""
      MERCHANT_INTEGRATION_BEARER_TOKEN: ""
      SWIMPAY_ALLOW_DEV_MERCHANT_SESSION: "false"
      SWIMPAY_ADMIN_TOKEN: ""

  swimpay-web:
    environment:
      NODE_ENV: production
      ADMIN_AUTH_MODE: signed_token
      ADMIN_TOKEN_HMAC_SECRET: ${ADMIN_TOKEN_HMAC_SECRET:?set ADMIN_TOKEN_HMAC_SECRET from external secret storage}
      DEV_ADMIN_TOKEN: ""
      DEV_ADMIN_OPERATOR_ID: ""
      DEV_ADMIN_ROLE: ""
      MERCHANT_INTEGRATION_BEARER_TOKEN: ""
      SWIMPAY_ALLOW_DEV_MERCHANT_SESSION: "false"
      SWIMPAY_ADMIN_TOKEN: ""
