<title>Accueil Personnel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
  /* ============================================================
     SwimPay — Écran 3 · Accueil Personnel (desktop + mobile)
     Grammaire vendorisée depuis les systèmes de composants récents :
     - tokens neutres : shadcn/ui v4 (apps/v4/app/globals.css)
     - anatomie contrôles (shadow-xs, ring) : shadcn + Origin UI
     - pattern metric (label → valeur → meta) : Tremor
     - Apple HIG : hit region ≥ 44×44 pt (Buttons), marges de contenu 20 pt,
       rythme 8 pt, boutons capsule, cartes 20 pt à coins intérieurs
       concentriques (inner = outer − inset)
     Identité : dérivée du logo officiel (design/pivot/assets/logo-original.jpeg)
     — fond vert forêt échantillonné sur l'image (#031A10 → #0B2E21 → #123E2F
     → #265543), logo blanc → bouton primaire blanc. Thème sombre unique,
     délibéré. Aucune dépendance.
     ============================================================ */
  :root{
    /* radius — échelle Apple-like sur base shadcn */
    --radius: .625rem;
    --radius-sm: calc(var(--radius) * .6);
    --radius-md: calc(var(--radius) * .8);
    --radius-lg: var(--radius);
    --radius-card: 20px;
    --radius-capsule: 999px;
    /* palette échantillonnée sur le fond du logo */
    --background: #0A2C20;
    --surface: #082418;
    --card: #0E3424;
    --foreground: #F2F7F4;
    --muted: rgba(242,247,244,.08);
    --muted-foreground: #9DB8AC;
    --border: rgba(242,247,244,.13);
    --input: rgba(242,247,244,.16);
    --ring: rgba(242,247,244,.45);
    --primary: #FFFFFF;
    --primary-foreground: #0B2E21;
    /* sémantique */
    --positive: #7FD8AE;
    /* points réseaux (anonymes) */
    --dot-1:#2CC7D6; --dot-2:#F5942E; --dot-3:#EFC02A; --dot-4:#5B82F5;
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / .25);
    --shadow-sm: 0 2px 6px 0 rgb(0 0 0 / .3), 0 1px 2px -1px rgb(0 0 0 / .3);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--foreground);
    background:
      radial-gradient(1100px 700px at 72% -6%, #164835 0%, transparent 60%),
      radial-gradient(900px 700px at 8% 100%, #10382A 0%, transparent 55%),
      linear-gradient(180deg, #0A2C20, #061F17 140%);
    background-color:#082418;
    font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.5; letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"Geist Mono",ui-monospace,monospace}
  svg{display:block; flex:none}
  .app{min-height:100vh; display:flex; flex-direction:column}

  /* ---------- Topbar ---------- */
  .topbar{
    background:rgba(6,28,20,.72); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:20;
  }
  .topbar-in{
    max-width:1120px; margin:0 auto; padding:0 20px; height:64px;
    display:flex; align-items:center; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:15.5px}
  .brand-img{width:20px; height:auto; display:block}
  .nav{display:flex; align-items:center; gap:4px; margin-left:12px}
  .nav a{
    text-decoration:none; color:var(--muted-foreground); font-weight:500; font-size:14px;
    padding:7px 12px; border-radius:var(--radius-md);
  }
  .nav a:hover{color:var(--foreground); background:var(--muted)}
  .nav a.active{color:var(--foreground); background:var(--muted)}
  .top-actions{margin-left:auto; display:flex; align-items:center; gap:10px}
  .search{
    display:flex; align-items:center; gap:8px; width:240px; height:40px;
    padding:0 16px; background:rgba(0,0,0,.22); border:1px solid var(--input);
    border-radius:var(--radius-capsule); box-shadow:var(--shadow-xs);
    color:var(--muted-foreground); font-size:14px;
  }
  .search:focus-within{border-color:var(--ring); outline:3px solid color-mix(in oklab, var(--ring) 35%, transparent)}
  .search input{border:0; outline:0; background:transparent; width:100%; font:inherit; color:var(--foreground)}
  .icon-btn{
    width:40px;height:40px; display:grid; place-items:center;
    background:rgba(0,0,0,.18); border:1px solid var(--input);
    border-radius:var(--radius-capsule); box-shadow:var(--shadow-xs);
    color:var(--foreground); cursor:pointer;
  }
  .icon-btn:hover{background:var(--muted)}
  .avatar{
    width:40px;height:40px;border-radius:50%; background:var(--muted);
    border:1px solid var(--border);
    display:grid; place-items:center; font-weight:600; font-size:13px; cursor:pointer;
  }

  /* ---------- Page ---------- */
  .page{max-width:1120px; margin:0 auto; padding:40px 20px 96px; width:100%}

  /* ---------- Hero (pattern metric Tremor) ---------- */
  .hero{padding:16px 4px 36px}
  .hero .label{font-size:13.5px; font-weight:500; color:var(--muted-foreground)}
  .amount{
    margin-top:6px; font-family:"Geist Mono",ui-monospace,monospace;
    font-size:clamp(2.4rem,5vw,3.4rem); font-weight:600; letter-spacing:-.03em;
    font-variant-numeric:tabular-nums; line-height:1.05;
  }
  .hero-actions{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:44px; padding:0 20px; border-radius:var(--radius-capsule);
    font:inherit; font-weight:500; font-size:14.5px; cursor:pointer;
    border:1px solid transparent; box-shadow:var(--shadow-xs);
    transition:background .12s ease;
  }
  .btn:focus-visible{outline:3px solid color-mix(in oklab, var(--ring) 45%, transparent); outline-offset:1px}
  .btn-primary{background:var(--primary); color:var(--primary-foreground)}
  .btn-primary:hover{background:#E4EEE8}
  .btn-outline{background:rgba(0,0,0,.14); border-color:var(--input); color:var(--foreground)}
  .btn-outline:hover{background:var(--muted)}

  /* ---------- Corps ---------- */
  .grid{display:grid; grid-template-columns:7fr 5fr; gap:20px; align-items:start}
  .section-title{font-size:13.5px; font-weight:500; color:var(--muted-foreground); margin:0 0 12px 2px}
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .tile{
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius-card); box-shadow:var(--shadow-xs);
    padding:20px; display:flex; flex-direction:column; gap:28px;
    cursor:pointer; text-align:left; font:inherit; color:inherit;
    transition:box-shadow .12s ease, border-color .12s ease;
  }
  .tile:hover{border-color:var(--ring); box-shadow:var(--shadow-sm)}
  .tile:focus-visible{outline:3px solid color-mix(in oklab, var(--ring) 45%, transparent); outline-offset:1px}
  .tile .ic{
    /* coin concentrique : 20 (carte) − 20 (inset) ≈ 10 */
    width:40px;height:40px; border-radius:10px;
    background:var(--muted); display:grid; place-items:center;
  }
  .tile b{font-weight:500; font-size:14.5px; letter-spacing:-.005em}

  .card{
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius-card); box-shadow:var(--shadow-xs);
    overflow:hidden;
  }
  .card-head{
    padding:16px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .card-head b{font-size:14.5px; font-weight:500}
  .link{font-size:13px; color:var(--muted-foreground); text-decoration:none; padding:6px 10px; border-radius:var(--radius-capsule)}
  .link:hover{color:var(--foreground); background:var(--muted)}
  .op{
    display:flex; align-items:center; gap:12px; padding:14px 20px;
    border-bottom:1px solid var(--border); min-height:44px;
  }
  .op:last-child{border-bottom:0}
  .op .who{display:flex; align-items:center; gap:10px; min-width:0}
  .dot{width:8px;height:8px;border-radius:50%}
  .op .name{font-weight:500; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .op .amt{
    margin-left:auto; font-family:"Geist Mono",ui-monospace,monospace;
    font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .amt.pos{color:var(--positive)}

  /* ---------- Nav mobile ---------- */
  .tabbar{display:none}

  /* ---------- Responsive ---------- */
  @media (max-width:860px){
    .nav,.search{display:none}
    .topbar-in{height:56px; padding:0 16px}
    .page{padding:24px 16px 110px}
    .hero{padding:8px 2px 28px}
    .hero-actions{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
    .hero-actions .btn{height:auto; min-height:64px; padding:12px 4px; flex-direction:column; gap:7px; font-size:12.5px; border-radius:16px}
    .grid{grid-template-columns:1fr; gap:24px}
    .tabbar{
      display:grid; grid-template-columns:repeat(4,1fr);
      position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:rgba(6,28,20,.85); backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border-top:1px solid var(--border);
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .tab{
      display:flex; flex-direction:column; align-items:center; gap:3px;
      font-size:11px; font-weight:500; color:var(--muted-foreground);
      text-decoration:none; padding:6px 0; border-radius:var(--radius-md);
      min-height:44px; justify-content:center;
    }
    .tab.active{color:var(--foreground)}
    .tab.active .tab-ic{background:var(--muted)}
    .tab-ic{width:34px;height:24px;border-radius:99px;display:grid;place-items:center}
  }
  @media (max-width:380px){
    .tiles{grid-template-columns:1fr}
  }
</style>
