patterns_id: amount_patterns_ru_v1
version: 1

currency_codes:
  rub:
    canonical: RUB
    symbols:
      - "₽"
      - "руб"
      - "руб."
      - "rub"
      - "rur"

amount_regexes:
  rub_after_amount:
    description: Amount followed by ruble currency marker.
    regex: '(?<amount>\\d{1,3}(?:[ \\u00A0]\\d{3})*(?:[,.]\\d{1,2})?|\\d+(?:[,.]\\d{1,2})?)\\s*(?<currency>₽|руб\\.?|rub|rur)'
    examples:
      - "137 ₽"
      - "1 337,50 руб."
      - "249.90 RUB"

  rub_before_amount:
    description: Currency marker before amount.
    regex: '(?<currency>rub|rur)\\s*(?<amount>\\d{1,3}(?:[ \\u00A0]\\d{3})*(?:[,.]\\d{1,2})?|\\d+(?:[,.]\\d{1,2})?)'
    examples:
      - "RUB 137.00"

amount_disambiguation:
  prefer:
    - amount_near_incoming_keyword
    - first_amount_in_title_if_title_has_direction
    - amount_before_balance_keyword
  avoid:
    - amount_after_balance_keyword
    - amount_near_cashback_keyword
    - amount_near_refund_keyword
    - amount_near_outgoing_keyword
